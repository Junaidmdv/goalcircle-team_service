services:
  minio:
    image: minio/minio:latest
    container_name: go-minio
    restart: always

    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # MinIO Console

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command: server /data --console-address ":9090"

    volumes:
      - minio-data:/data

volumes:
  minio-data: