services:
  nats:
    image: nats:2.12-alpine
    container_name: goalcircle-nats
    restart: unless-stopped

    ports:
      - "4222:4222"
      - "8222:8222"

    volumes:
      - ./nats.conf:/etc/nats/nats.conf
      - nats_data:/data

    command: ["-c", "/etc/nats/nats.conf"]

  nats-client:
    image: natsio/nats-box:latest
    container_name: goalcircle-nats-client
    depends_on:
      - nats
    entrypoint: /bin/sh
    tty: true

volumes:
  nats_data: